name: Build APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Usando JDK 11, que é padrão para projetos Android mais antigos
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      # Baixa o Gradle automaticamente, sem depender do 'gradlew'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Tenta usar o wrapper, se não existir, continua sem erro (|| true)
      - name: Make gradlew executable
        run: chmod +x ./gradlew || true

      # Tenta compilar com gradlew, se falhar, usa o gradle global
      - name: Build Debug APK
        run: ./gradlew assembleDebug || gradle assembleDebug

      - name: Upload APK (Artefato)
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
