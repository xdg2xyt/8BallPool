name: Build APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Gradle (Versão Antiga Compatível)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.9.4'

      # Remove o erro de compatibilidade com AndroidX
      - name: Criar gradle.properties
        run: echo "android.useAndroidX=true" > gradle.properties

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK (Artefato)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
